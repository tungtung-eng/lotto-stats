# 每週二、五開獎後自動：抓新號碼 → 重跑統計與 AI 模型 → 存檔（網站自動更新）
name: 開獎後更新
on:
  schedule:
    - cron: "40 14 * * 2,5"   # 台灣時間 週二、五 22:40
    - cron: "30 0 * * 3,6"    # 台灣時間 週三、六 08:30（補跑，萬一晚上官網還沒更新）
  workflow_dispatch: {}        # 也可以在 GitHub 網頁上手動按「Run」
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/fetch.py
      - run: python tools/analyze.py
        env:
          TZ: Asia/Taipei
      - name: 有變動才存檔
        run: |
          git config user.name "lotto-bot"
          git config user.email "lotto-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "沒有新資料"; else git commit -m "自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" && git push; fi
